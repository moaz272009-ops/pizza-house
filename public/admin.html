<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pizza House Admin</title><style>*{box-sizing:border-box}body{font-family:Arial;background:#f4f4f4;margin:0;padding:30px}.wrap{max-width:900px;margin:auto}.panel{background:white;padding:25px;border-radius:16px;margin-bottom:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,textarea{padding:12px;border:1px solid #ccc;border-radius:8px;font:inherit;width:100%}textarea{grid-column:1/-1}button{padding:11px 16px;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.add{background:#e63946;color:white}.delete{background:#222;color:white}.edit{background:#ffb703}.item{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid #eee}.actions{display:flex;gap:8px}@media(max-width:650px){.form{grid-template-columns:1fr}.item{display:block}.actions{margin-top:10px}}</style></head><body><div class="wrap"><h1>🔐 Pizza House Owner Panel</h1><p>Add/edit/delete yahan karo. Customer website same database se data legi.</p><div class="panel"><h2>Add Pizza</h2><br><div class="form"><input id="name" placeholder="Pizza name"><input id="price" type="number" placeholder="Price"><input id="image" placeholder="Image URL"><textarea id="description" placeholder="Description"></textarea><button class="add" onclick="addPizza()">Add Pizza</button></div><p id="msg"></p></div><div class="panel"><h2>Current Pizzas</h2><div id="list">Loading...</div></div></div><script>async function load(){const pizzas=await fetch("/api/pizzas").then(r=>r.json());const list=document.getElementById("list");list.innerHTML="";pizzas.forEach(p=>{const d=document.createElement("div");d.className="item";d.innerHTML=`<div><h3>${p.name}</h3><p>Rs. ${p.price}</p></div><div class="actions"><button class="edit" onclick="editPizza(${p.id},${JSON.stringify(p.name)},${p.price})">Edit</button><button class="delete" onclick="deletePizza(${p.id})">Delete</button></div>`;list.appendChild(d)})}async function addPizza(){const data={name:document.getElementById("name").value.trim(),price:document.getElementById("price").value,image:document.getElementById("image").value.trim(),description:document.getElementById("description").value.trim()};if(!data.name||!data.price){document.getElementById("msg").textContent="Name aur price required.";return}await fetch("/api/pizzas",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});["name","price","image","description"].forEach(id=>document.getElementById(id).value="");document.getElementById("msg").textContent="Pizza add ho gaya 🍕";load()}async function deletePizza(id){await fetch("/api/pizzas/"+id,{method:"DELETE"});load()}async function editPizza(id,name,price){const n=prompt("Pizza name:",name);if(n===null)return;const p=prompt("Price:",price);if(p===null)return;await fetch("/api/pizzas/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n,price:p})});load()}load();</script></body></html>
