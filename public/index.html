<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pizza House</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#fff8f0;color:#222}nav{position:sticky;top:0;background:#171717;color:white;padding:18px 8%;display:flex;justify-content:space-between;z-index:5}nav a{color:white;text-decoration:none;margin-left:20px}.logo{font-size:25px;font-weight:bold;color:#ffb703}.hero{padding:80px 8%;text-align:center}.hero h1{font-size:50px}.hero span{color:#e63946}section{padding:70px 8%;scroll-margin-top:70px}.title{text-align:center;font-size:38px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:25px}.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 5px 20px #0001}.card img{width:100%;height:210px;object-fit:cover}.info{padding:20px}.price{color:#e63946;font-size:20px;font-weight:bold}.contact{background:#171717;color:white;text-align:center;padding:45px;border-radius:18px}@media(max-width:750px){.grid{grid-template-columns:1fr}.hero h1{font-size:38px}}</style></head><body><nav><div class="logo">🍕 Pizza House</div><div><a href="#home">Home</a><a href="#menu">Menu</a><a href="#contact">Contact</a></div></nav><section class="hero" id="home"><h1>Fresh Pizza. <span>Made With Love.</span></h1><p>Fresh, hot and delicious pizzas.</p></section><section id="menu"><h2 class="title">Our Menu</h2><div class="grid" id="pizzaMenu">Loading...</div></section><section id="contact"><div class="contact"><h2>Ready to Order?</h2><p>📞 0300-1234567</p></div></section><script>async function loadPizzas(){const box=document.getElementById("pizzaMenu");try{const pizzas=await fetch("/api/pizzas").then(r=>r.json());box.innerHTML="";pizzas.forEach(p=>{box.innerHTML+=`<div class="card"><img src="${p.image}" alt="${p.name}"><div class="info"><h2>${p.name}</h2><p>${p.description}</p><div class="price">Rs. ${p.price}</div></div></div>`})}catch(e){box.innerHTML="<p>Backend se connection nahi ho raha.</p>"}}loadPizzas();document.addEventListener("click",e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;const t=document.querySelector(a.getAttribute("href"));if(t){e.preventDefault();t.scrollIntoView({behavior:"smooth"})}});</script></body></html>
